name: Android build

on:
  push:
    branches: [main, "work/**"]
    paths:
      - "AutoSense/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "AutoSense/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        working-directory: AutoSense
        run: chmod +x gradlew

      - name: Build and test
        working-directory: AutoSense
        run: ./gradlew --no-daemon clean test assembleDebug

      - name: Calculate APK SHA-256
        working-directory: AutoSense
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: autosense-debug-apk
          path: AutoSense/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
